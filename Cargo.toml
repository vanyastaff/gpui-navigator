[package]
name = "gpui-navigator"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Navigator for GPUI with transitions, nested routing, guards, and middleware"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/gpui-navigator"
homepage = "https://github.com/vanyastaff/gpui-navigator"
repository = "https://github.com/vanyastaff/gpui-navigator"
keywords = ["gpui", "navigator", "navigation", "transitions", "ui"]
categories = ["gui", "development-tools"]
authors = ["Vanya Stafford"]
exclude = [
    ".github/",
    ".idea/",
    "target/",
    "*.md",
    "!README.md",
]

[package.metadata.docs.rs]
# Backends are mutually exclusive, so document the default one with every optional module enabled.
features = ["gpui-02", "log", "guard", "middleware", "cache", "transition"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[dependencies]
# GPUI backend - enable exactly one via the `gpui-02` / `gpui-pre` / `gpui-fast` features.
# All three expose their library as `gpui`, so the crate code is shared.
gpui = { version = "0.2", optional = true }
gpui_pre = { package = "gpui-pre", version = "0.3", optional = true }
gpui_fast = { package = "gpui-fast", version = "0.1", optional = true }

# Optional dependencies
lru = { version = "0.16", optional = true }
log = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = ["gpui-02", "log", "guard", "middleware", "cache", "transition"]
# GPUI backends (mutually exclusive)
# Zed's published `gpui` 0.2 (gpui-component 0.5.x)
gpui-02 = ["dep:gpui"]
# `gpui-pre`: snapshots of current gpui from the Zed repository (gpui-component 0.6.x)
gpui-pre = ["dep:gpui_pre"]
# `gpui-fast`: the gpui fork used by gpui-component 0.7.x
gpui-fast = ["dep:gpui_fast"]
# Core features
guard = []
middleware = []
transition = []
# Optional LRU cache for route resolution
cache = ["dep:lru"]
# Logging backend - choose one (mutually exclusive)
log = ["dep:log"]
tracing = ["dep:tracing"]
# Enables the selected backend's `test-support` (TestAppContext, #[gpui::test]).
# Turned on automatically for this crate's own tests via the self dev-dependency below.
test-support = ["gpui?/test-support", "gpui_pre?/test-support", "gpui_fast?/test-support"]

[dev-dependencies]
# Self-dependency so `cargo test` enables `test-support` on whichever backend is selected.
gpui-navigator = { path = ".", default-features = false, features = ["test-support"] }
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "macros"] }

[[example]]
name = "transition_demo"
path = "examples/transition_demo.rs"
required-features = ["gpui-02"]

[[example]]
name = "nested_demo"
path = "examples/nested_demo.rs"
required-features = ["gpui-02"]

[[example]]
name = "stateful_demo"
path = "examples/stateful_demo.rs"
required-features = ["gpui-02"]

[[example]]
name = "error_demo"
path = "examples/error_demo.rs"
required-features = ["gpui-02"]

[[example]]
name = "guard_demo"
path = "examples/guard_demo.rs"
required-features = ["gpui-02"]

[[example]]
name = "middleware_demo"
path = "examples/middleware_demo.rs"
required-features = ["gpui-02"]

[[example]]
name = "lifecycle_demo"
path = "examples/lifecycle_demo.rs"
required-features = ["gpui-02"]
